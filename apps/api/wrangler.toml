name = "acepharm-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database (Single System of Record - region pinned to weur)
[[d1_databases]]
binding = "DB"
database_name = "acepharm-db"
database_id = "b3ae5b86-7cdb-4c4a-b966-c64a0caef376"
migrations_dir = "drizzle/migrations"

# Vectorize (Embeddings index for Ace RAG)
[[vectorize]]
binding = "VECTORIZE"
index_name = "acepharm-content"

# Workers AI (Free embeddings model)
[ai]
binding = "AI"

# KV Namespaces (Rate limits & Response Caching)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "8b8d9da569bf4df6b03ed4398a0d3a0b"

[[kv_namespaces]]
binding = "CACHE"
id = "173f61310b0f45fb85541bc2fc0cf776"

# R2 Buckets (Assets & Exports)
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "acepharm-assets"

# Cron Triggers (Weekly Insight Generator - runs every Monday at 04:00 UTC)
[triggers]
crons = ["0 4 * * 1"]

# ==========================================
# Staging Environment Configuration
# ==========================================
[env.staging]
name = "acepharm-api-staging"

[env.staging.triggers]
crons = ["0 4 * * 1"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "acepharm-db-staging"
database_id = "be2624a9-de6d-46d2-8a7c-f65e3b124e1a"
migrations_dir = "drizzle/migrations"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "acepharm-content"

[env.staging.ai]
binding = "AI"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "945bcb8d14e34a29b716fdbeecd0bdd5"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "0f795f8a709444acb84b6975174b3baf"

[[env.staging.r2_buckets]]
binding = "ASSETS"
bucket_name = "acepharm-assets"
