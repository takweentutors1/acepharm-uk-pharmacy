name = "acepharm-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database (Single System of Record - region pinned to weur)
[[d1_databases]]
binding = "DB"
database_name = "acepharm-db"
database_id = "b3ae5b86-7cdb-4c4a-b966-c64a0caef376"
migrations_dir = "drizzle/migrations"

# Vectorize (Embeddings index for Ace RAG)
[[vectorize]]
binding = "VECTORIZE"
index_name = "acepharm-content"

# Workers AI (Free embeddings model)
[ai]
binding = "AI"

# KV Namespaces (Rate limits & Response Caching)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "8b8d9da569bf4df6b03ed4398a0d3a0b"

[[kv_namespaces]]
binding = "CACHE"
id = "173f61310b0f45fb85541bc2fc0cf776"

# R2 Buckets (Assets & Exports)
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "acepharm-assets"

# Cron Triggers:
# 1. Daily D1 automated backup to R2 (runs daily at 03:00 UTC)
# 2. Weekly Insight Generator (runs every Monday at 04:00 UTC)
[triggers]
crons = ["0 3 * * *", "0 4 * * 1"]

# Environment Variables
[vars]
PUBLIC_SITE_URL = "https://acepharm-marketing.pages.dev"
PUBLIC_APP_URL = "https://acepharm-app.pages.dev"
CUSTOM_DOMAIN_SITE = "https://acepharmexams.co.uk"
CUSTOM_DOMAIN_APP = "https://app.acepharmexams.co.uk"
CUSTOM_DOMAIN_API = "https://api.acepharmexams.co.uk"
STRIPE_PRICE_ID_MONTHLY = "price_1U9ixsE4ZQJ9iwGZ7rF40bDe"
STRIPE_PRICE_ID_YEARLY = "price_1U9j0pE4ZQJ9iwGZ0At7aZH8"
STRIPE_WEBHOOK_ENDPOINT_ID = "we_1U9jWDE4ZQJ9iwGZuHESR1EC"
STRIPE_PUBLISHABLE_KEY = "pk_test_51SbDyYE4ZQJ9iwGZD3Un8Ifrd06XPQ71eTwfWLCyn1y4hyP5HEcbLNdJYqgb4XeHIAqM2rbJ33KOAPseyGajXZLg00k2oGQRKk"

# ==========================================
# Staging Environment Configuration
# ==========================================
[env.staging]
name = "acepharm-api-staging"

[env.staging.triggers]
crons = ["0 3 * * *", "0 4 * * 1"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "acepharm-db-staging"
database_id = "be2624a9-de6d-46d2-8a7c-f65e3b124e1a"
migrations_dir = "drizzle/migrations"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "acepharm-content"

[env.staging.ai]
binding = "AI"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "945bcb8d14e34a29b716fdbeecd0bdd5"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "0f795f8a709444acb84b6975174b3baf"

[[env.staging.r2_buckets]]
binding = "ASSETS"
bucket_name = "acepharm-assets"
