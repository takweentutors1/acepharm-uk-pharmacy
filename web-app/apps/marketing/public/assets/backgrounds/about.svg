<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="aboutGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1440" height="500" fill="#F8FAFC"/>
  <rect width="1440" height="500" fill="url(#aboutGlow)"/>
  <!-- Abstract people/connection nodes -->
  <g opacity="0.04" fill="#4F46E5">
    <circle cx="300" cy="180" r="20"/>
    <circle cx="300" cy="170" r="8"/>
    <circle cx="500" cy="220" r="16"/>
    <circle cx="500" cy="212" r="6"/>
    <circle cx="720" cy="200" r="24"/>
    <circle cx="720" cy="188" r="10"/>
    <circle cx="940" cy="220" r="16"/>
    <circle cx="940" cy="212" r="6"/>
    <circle cx="1140" cy="180" r="20"/>
    <circle cx="1140" cy="170" r="8"/>
  </g>
  <!-- Connection lines between people -->
  <g opacity="0.03" stroke="#4F46E5" stroke-width="1" fill="none">
    <line x1="320" y1="180" x2="484" y2="220"/>
    <line x1="516" y1="220" x2="696" y2="200"/>
    <line x1="744" y1="200" x2="924" y2="220"/>
    <line x1="956" y1="220" x2="1120" y2="180"/>
  </g>
  <!-- Mission/vision abstract shapes -->
  <g opacity="0.025" fill="#0F766E">
    <circle cx="720" cy="350" r="40" stroke="#0F766E" stroke-width="1" fill="none"/>
    <circle cx="720" cy="350" r="60" stroke="#0F766E" stroke-width="0.5" fill="none"/>
  </g>
</svg>