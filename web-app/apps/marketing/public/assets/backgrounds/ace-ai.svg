<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F1F2FC;stop-opacity:0.35" />
      <stop offset="50%" style="stop-color:#F8FAFC;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#EFFAF8;stop-opacity:0.25" />
    </linearGradient>
    <radialGradient id="aiGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1440" height="500" fill="#F8FAFC"/>
  <rect width="1440" height="500" fill="url(#aiGrad)"/>
  <rect width="1440" height="500" fill="url(#aiGlow)"/>
  <!-- Neural network nodes -->
  <g opacity="0.05" fill="#4F46E5">
    <!-- Layer 1 -->
    <circle cx="200" cy="150" r="4"/>
    <circle cx="200" cy="250" r="4"/>
    <circle cx="200" cy="350" r="4"/>
    <!-- Layer 2 -->
    <circle cx="400" cy="120" r="3"/>
    <circle cx="400" cy="200" r="3"/>
    <circle cx="400" cy="280" r="3"/>
    <circle cx="400" cy="360" r="3"/>
    <!-- Layer 3 -->
    <circle cx="600" cy="180" r="3"/>
    <circle cx="600" cy="250" r="4"/>
    <circle cx="600" cy="320" r="3"/>
    <!-- Central hub -->
    <circle cx="720" cy="250" r="6"/>
  </g>
  <!-- Right side mirror -->
  <g opacity="0.04" fill="#0F766E">
    <circle cx="840" cy="180" r="3"/>
    <circle cx="840" cy="250" r="3"/>
    <circle cx="840" cy="320" r="3"/>
    <circle cx="1040" cy="120" r="3"/>
    <circle cx="1040" cy="200" r="3"/>
    <circle cx="1040" cy="280" r="3"/>
    <circle cx="1040" cy="360" r="3"/>
    <circle cx="1240" cy="150" r="4"/>
    <circle cx="1240" cy="250" r="4"/>
    <circle cx="1240" cy="350" r="4"/>
  </g>
  <!-- Connection lines -->
  <g opacity="0.03" stroke="#4F46E5" stroke-width="0.8" fill="none">
    <line x1="200" y1="150" x2="400" y2="120"/>
    <line x1="200" y1="150" x2="400" y2="200"/>
    <line x1="200" y1="250" x2="400" y2="200"/>
    <line x1="200" y1="250" x2="400" y2="280"/>
    <line x1="200" y1="350" x2="400" y2="280"/>
    <line x1="200" y1="350" x2="400" y2="360"/>
    <line x1="400" y1="120" x2="600" y2="180"/>
    <line x1="400" y1="200" x2="600" y2="250"/>
    <line x1="400" y1="280" x2="600" y2="250"/>
    <line x1="400" y1="360" x2="600" y2="320"/>
    <line x1="600" y1="180" x2="720" y2="250"/>
    <line x1="600" y1="250" x2="720" y2="250"/>
    <line x1="600" y1="320" x2="720" y2="250"/>
  </g>
  <g opacity="0.025" stroke="#0F766E" stroke-width="0.8" fill="none">
    <line x1="720" y1="250" x2="840" y2="180"/>
    <line x1="720" y1="250" x2="840" y2="250"/>
    <line x1="720" y1="250" x2="840" y2="320"/>
    <line x1="840" y1="180" x2="1040" y2="120"/>
    <line x1="840" y1="180" x2="1040" y2="200"/>
    <line x1="840" y1="250" x2="1040" y2="200"/>
    <line x1="840" y1="250" x2="1040" y2="280"/>
    <line x1="840" y1="320" x2="1040" y2="280"/>
    <line x1="840" y1="320" x2="1040" y2="360"/>
    <line x1="1040" y1="120" x2="1240" y2="150"/>
    <line x1="1040" y1="200" x2="1240" y2="250"/>
    <line x1="1040" y1="280" x2="1240" y2="250"/>
    <line x1="1040" y1="360" x2="1240" y2="350"/>
  </g>
  <!-- Pulse rings around central node -->
  <g opacity="0.03" stroke="#4F46E5" stroke-width="1" fill="none">
    <circle cx="720" cy="250" r="20"/>
    <circle cx="720" cy="250" r="35"/>
    <circle cx="720" cy="250" r="50"/>
  </g>
</svg>