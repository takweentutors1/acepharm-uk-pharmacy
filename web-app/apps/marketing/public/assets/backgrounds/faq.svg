<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="faqGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1440" height="500" fill="#F8FAFC"/>
  <rect width="1440" height="500" fill="url(#faqGlow)"/>
  <!-- Subtle question mark watermarks -->
  <g opacity="0.025" fill="#4F46E5">
    <text x="150" y="250" font-family="Georgia, serif" font-size="200" font-weight="bold">?</text>
    <text x="1050" y="300" font-family="Georgia, serif" font-size="160" font-weight="bold">?</text>
  </g>
  <!-- Subtle horizontal lines suggesting expandable sections -->
  <g opacity="0.03" stroke="#4F46E5" stroke-width="1">
    <line x1="400" y1="150" x2="1040" y2="150"/>
    <line x1="400" y1="200" x2="1040" y2="200"/>
    <line x1="400" y1="250" x2="1040" y2="250"/>
    <line x1="400" y1="300" x2="1040" y2="300"/>
    <line x1="400" y1="350" x2="1040" y2="350"/>
  </g>
  <!-- Plus signs suggesting expandable -->
  <g opacity="0.04" stroke="#4F46E5" stroke-width="1.5">
    <line x1="1000" y1="145" x2="1000" y2="155"/>
    <line x1="995" y1="150" x2="1005" y2="150"/>
    <line x1="1000" y1="195" x2="1000" y2="205"/>
    <line x1="995" y1="200" x2="1005" y2="200"/>
    <line x1="1000" y1="245" x2="1000" y2="255"/>
    <line x1="995" y1="250" x2="1005" y2="250"/>
    <line x1="1000" y1="295" x2="1000" y2="305"/>
    <line x1="995" y1="300" x2="1005" y2="300"/>
    <line x1="1000" y1="345" x2="1000" y2="355"/>
    <line x1="995" y1="350" x2="1005" y2="350"/>
  </g>
</svg>