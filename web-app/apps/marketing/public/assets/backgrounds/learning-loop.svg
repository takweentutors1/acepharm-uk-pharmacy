<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F1F2FC;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#F8FAFC;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#EFFAF8;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="1440" height="500" fill="#F8FAFC"/>
  <rect width="1440" height="500" fill="url(#loopGrad)"/>
  <!-- Circular flow arrows representing learning loop -->
  <g opacity="0.04" stroke="#4F46E5" stroke-width="2" fill="none">
    <circle cx="720" cy="250" r="120" stroke-dasharray="8,12"/>
    <circle cx="720" cy="250" r="80" stroke-dasharray="6,10"/>
  </g>
  <!-- Four node points on the circle -->
  <g opacity="0.06" fill="#4F46E5">
    <circle cx="720" cy="130" r="4"/>
    <circle cx="840" cy="250" r="4"/>
    <circle cx="720" cy="370" r="4"/>
    <circle cx="600" cy="250" r="4"/>
  </g>
  <!-- Arrow indicators -->
  <g opacity="0.04" fill="#0F766E">
    <polygon points="780,180 790,170 800,180"/>
    <polygon points="780,320 790,330 800,320"/>
  </g>
  <!-- Subtle flowing lines -->
  <path d="M0,350 Q360,300 720,330 T1440,310" stroke="#4F46E5" stroke-width="0.5" fill="none" opacity="0.05"/>
  <path d="M0,370 Q360,320 720,350 T1440,330" stroke="#0F766E" stroke-width="0.5" fill="none" opacity="0.04"/>
</svg>