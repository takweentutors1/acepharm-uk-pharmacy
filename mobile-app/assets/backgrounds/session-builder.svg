<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sessionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EFFAF8;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#F8FAFC;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="400" height="800" fill="url(#sessionGrad)"/>
  <!-- Topic filter chips hint -->
  <g opacity="0.04" fill="none" stroke="#4F46E5" stroke-width="0.8">
    <rect x="30" y="100" width="80" height="28" rx="14"/>
    <rect x="120" y="100" width="100" height="28" rx="14"/>
    <rect x="230" y="100" width="70" height="28" rx="14"/>
    <rect x="310" y="100" width="60" height="28" rx="14"/>
  </g>
  <!-- Timer icon hint -->
  <g opacity="0.04" stroke="#0F766E" stroke-width="1" fill="none">
    <circle cx="200" cy="250" r="30"/>
    <line x1="200" y1="230" x2="200" y2="250"/>
    <line x1="200" y1="250" x2="215" y2="260"/>
  </g>
  <!-- Question count -->
  <g opacity="0.03" fill="#4F46E5">
    <text x="170" y="350" font-family="sans-serif" font-size="24" font-weight="bold">30</text>
  </g>
</svg>