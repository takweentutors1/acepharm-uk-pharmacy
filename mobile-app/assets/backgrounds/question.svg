<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMin slice">
  <defs>
    <radialGradient id="questionGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="800" fill="#F8FAFC"/>
  <rect width="400" height="800" fill="url(#questionGlow)"/>
  <!-- Abstract question mark -->
  <g opacity="0.03" fill="#4F46E5">
    <text x="150" y="400" font-family="Georgia, serif" font-size="120" font-weight="bold">?</text>
  </g>
  <!-- Subtle option lines -->
  <g opacity="0.03" stroke="#4F46E5" stroke-width="0.5">
    <line x1="50" y1="500" x2="350" y2="500"/>
    <line x1="50" y1="550" x2="350" y2="550"/>
    <line x1="50" y1="600" x2="350" y2="600"/>
    <line x1="50" y1="650" x2="350" y2="650"/>
  </g>
  <!-- Confidence dots -->
  <g opacity="0.04" fill="#0F766E">
    <circle cx="80" cy="720" r="3"/>
    <circle cx="160" cy="720" r="3"/>
    <circle cx="240" cy="720" r="3"/>
    <circle cx="320" cy="720" r="3"/>
  </g>
</svg>