    <rect x="40" y="250" width="140" height="180" rx="8"/>
    <rect x="220" y="250" width="140" height="180" rx="8"/>
  </g>
  <!-- Checkmarks -->
  <g opacity="0.04" stroke="#0F766E" stroke-width="1.5" fill="none">
    <polyline points="235,320 245,330 260,310"/>
    <polyline points="235,350 245,360 260,340"/>
    <polyline points="235,380 245,390 260,370"/>
