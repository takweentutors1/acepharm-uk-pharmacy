<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F1F2FC;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#F8FAFC;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="subGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="800" fill="url(#subGrad)"/>
  <rect width="400" height="800" fill="url(#subGlow)"/>
  <!-- Star/sparkle accent -->
