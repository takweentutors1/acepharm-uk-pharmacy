<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="mobileHeroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F1F2FC;stop-opacity:0.5" />
      <stop offset="40%" style="stop-color:#F8FAFC;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="mobileGlow1" cx="30%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="mobileGlow2" cx="70%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#0F766E;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#0F766E;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="800" fill="url(#mobileHeroGrad)"/>
  <rect width="400" height="800" fill="url(#mobileGlow1)"/>
  <rect width="400" height="800" fill="url(#mobileGlow2)"/>
  <!-- Abstract pharmacy hexagons -->
  <g opacity="0.04" fill="#4F46E5">
    <polygon points="50,120 70,108 90,120 90,144 70,156 50,144"/>
    <polygon points="90,120 110,108 130,120 130,144 110,156 90,144"/>
    <polygon points="70,156 90,144 110,156 110,180 90,192 70,180"/>
  </g>
  <g opacity="0.03" fill="#0F766E">
    <polygon points="300,180 320,168 340,180 340,204 320,216 300,204"/>
    <polygon points="340,180 360,168 380,180 380,204 360,216 340,204"/>
    <polygon points="320,216 340,204 360,216 360,240 340,252 320,240"/>
  </g>
  <!-- Subtle flowing curves -->
  <path d="M0,500 Q100,480 200,490 T400,480" stroke="#4F46E5" stroke-width="0.8" fill="none" opacity="0.05"/>
  <path d="M0,520 Q100,500 200,510 T400,500" stroke="#0F766E" stroke-width="0.5" fill="none" opacity="0.04"/>
  <!-- Floating dots -->
  <circle cx="60" cy="200" r="2" fill="#4F46E5" opacity="0.06"/>
  <circle cx="200" cy="150" r="1.5" fill="#4F46E5" opacity="0.05"/>
  <circle cx="340" cy="280" r="2" fill="#0F766E" opacity="0.04"/>
</svg>