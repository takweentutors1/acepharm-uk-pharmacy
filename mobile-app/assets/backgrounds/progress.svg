<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMin slice">
  <defs>
    <radialGradient id="progressGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="800" fill="#F8FAFC"/>
  <rect width="400" height="800" fill="url(#progressGlow)"/>
  <!-- Abstract bar chart -->
  <g opacity="0.04" fill="#4F46E5">
    <rect x="60" y="200" width="30" height="80" rx="4"/>
    <rect x="110" y="160" width="30" height="120" rx="4"/>
    <rect x="160" y="180" width="30" height="100" rx="4"/>
    <rect x="210" y="140" width="30" height="140" rx="4"/>
    <rect x="260" y="120" width="30" height="160" rx="4"/>
    <rect x="310" y="100" width="30" height="180" rx="4"/>
  </g>
  <!-- Trend line -->
  <path d="M75,200 Q125,160 175,180 Q225,140 275,120 Q325,100 375,80" stroke="#0F766E" stroke-width="1" fill="none" opacity="0.05"/>
  <!-- Accuracy ring hint -->
  <g opacity="0.03" stroke="#4F46E5" stroke-width="1.5" fill="none">
    <circle cx="200" cy="400" r="60"/>
    <circle cx="200" cy="400" r="45" stroke-dasharray="6,4"/>
  </g>
</svg>