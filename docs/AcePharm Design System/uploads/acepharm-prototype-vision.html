<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AcePharm — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — from Developer Brief Section 13
   ============================================================ */
:root{
  --indigo:#4F46E5; --indigo-deep:#3730A3; --indigo-wash:#F1F2FC;
  --ink:#111827; --slate:#64748B; --canvas:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0;
  --teal:#0F766E; --success:#15803D; --warning:#B45309; --danger:#B91C1C; --info:#0369A1;
  --success-wash:#F0FDF4; --danger-wash:#FEF2F2; --warning-wash:#FFFBEB;
  --r-btn:11px; --r-input:10px; --r-card:15px; --r-panel:22px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:4px}
#feedback-live:focus,#feedback-live:focus-visible{outline:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------- layout ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 var(--s5)}
.wrap-narrow{max-width:760px;margin:0 auto;padding:0 var(--s5)}
.sec{padding:var(--s9) 0}
.sec-sm{padding:var(--s8) 0}
@media(max-width:768px){.sec{padding:var(--s7) 0}.sec-sm{padding:var(--s6) 0}}

/* ---------- type ---------- */
h1,h2,h3,h4{line-height:1.15;letter-spacing:-0.02em;font-weight:600}
.display{font-size:clamp(36px,4.6vw,53px);font-weight:600;letter-spacing:-0.035em}
h1{font-size:clamp(32px,4vw,48px)}
h2{font-size:clamp(27px,3.2vw,38px)}
h3{font-size:clamp(20px,2vw,26px)}
h4{font-size:19px}
.lede{font-size:19px;color:var(--slate);line-height:1.65}
.body-lg{font-size:18px;line-height:1.7}
.small{font-size:14px}
.micro{font-size:13px;color:var(--slate)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--indigo)}
.muted{color:var(--slate)}
.measure{max-width:68ch}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:44px;padding:11px 20px;border-radius:var(--r-btn);border:1px solid transparent;
  font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--indigo);color:#fff}
.btn-primary:hover{background:var(--indigo-deep)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border)}
.btn-secondary:hover{border-color:var(--slate)}
.btn-ghost{background:transparent;color:var(--slate);padding:10px 12px}
.btn-ghost:hover{color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-lg{min-height:52px;padding:14px 26px;font-size:16px}
.btn-sm{min-height:38px;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--s5)}
.card-flush{padding:0;overflow:hidden}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-panel);padding:var(--s6)}
.grid{display:grid;gap:var(--s4)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- pills / labels ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--slate)}
.pill-indigo{background:var(--indigo-wash);border-color:#DDDEF9;color:var(--indigo-deep)}
.pill-teal{background:#EFFAF8;border-color:#CCEAE6;color:var(--teal)}
.pill-warn{background:var(--warning-wash);border-color:#FDE9C8;color:var(--warning)}
.pill-danger{background:var(--danger-wash);border-color:#FBD5D5;color:var(--danger)}
.pill-success{background:var(--success-wash);border-color:#CDEBD6;color:var(--success)}

/* ---------- forms ---------- */
.field{margin-bottom:var(--s4)}
.label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.input,.select{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-input);background:var(--surface);font-size:15px}
.input:focus,.select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.13)}
.hint{font-size:13px;color:var(--slate);margin-top:6px}
.err{font-size:13px;color:var(--danger);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.check{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;line-height:1.5;cursor:pointer;padding:4px 0}
.check input{width:19px;height:19px;margin-top:2px;accent-color:var(--indigo);flex:none;cursor:pointer}

/* choice tiles */
.choice{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;min-height:56px;padding:14px 16px;
  border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--indigo)}
.choice[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-wash);box-shadow:inset 0 0 0 1px var(--indigo)}
.choice-stack{display:flex;flex-direction:column;gap:10px}

/* ---------- misc ---------- */
.rule{height:1px;background:var(--border);border:0;margin:var(--s6) 0}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--s3)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.wrapf{flex-wrap:wrap}
.gap2{gap:var(--s2)}.gap3{gap:var(--s3)}.gap4{gap:var(--s4)}.gap5{gap:var(--s5)}
.mt2{margin-top:var(--s2)}.mt3{margin-top:var(--s3)}.mt4{margin-top:var(--s4)}.mt5{margin-top:var(--s5)}.mt6{margin-top:var(--s6)}
.mb2{margin-bottom:var(--s2)}.mb3{margin-bottom:var(--s3)}.mb4{margin-bottom:var(--s4)}.mb5{margin-bottom:var(--s5)}.mb6{margin-bottom:var(--s6)}
.tc{text-align:center}
.hide{display:none !important}

table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
table.tbl th,table.tbl td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl th{font-weight:600;font-size:13px;color:var(--indigo-deep);background:var(--indigo-wash);text-transform:uppercase;letter-spacing:.04em}
.tbl-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
.tbl-scroll table.tbl th:first-child,.tbl-scroll table.tbl td:first-child{padding-left:16px}

/* ============================================================
   MARKETING
   ============================================================ */
.mkt-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.mkt-nav .wrap{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px;letter-spacing:-.02em;cursor:pointer;background:none;border:0}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--indigo),var(--teal));display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;flex:none}
.nav-links{display:flex;gap:var(--s5);align-items:center}
.nav-links a{color:var(--slate);text-decoration:none;font-size:15px;font-weight:500}
.nav-links a:hover{color:var(--ink)}
@media(max-width:920px){.nav-links{display:none}}

.hero{position:relative;overflow:hidden;padding:var(--s9) 0 var(--s8)}
.hero-glow{position:absolute;inset:auto 0 auto 50%;transform:translateX(-50%);top:-380px;width:1100px;height:700px;
  background:radial-gradient(ellipse at center,rgba(79,70,229,.16),rgba(15,118,110,.07) 45%,transparent 70%);pointer-events:none;filter:blur(8px)}
.hero .wrap{position:relative}
.hero-grid{display:grid;grid-template-columns:1.02fr 1fr;gap:var(--s8);align-items:center}
@media(max-width:1000px){.hero-grid{grid-template-columns:1fr;gap:var(--s7)}}

/* hero product visual — the signature element */
.hv{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-panel);padding:var(--s5);
  box-shadow:0 24px 60px -28px rgba(17,24,39,.28);position:relative}
.hv-row{display:flex;gap:var(--s3);margin-top:var(--s4)}
.hv-tile{flex:1;border:1px solid var(--border);border-radius:12px;padding:13px 14px;background:var(--canvas)}
.hv-lab{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
.hv-val{font-size:22px;font-weight:600;margin-top:3px;letter-spacing:-.02em}
.hv-rec{margin-top:var(--s3);border:1px solid #DDDEF9;background:var(--indigo-wash);border-radius:12px;padding:14px 15px}
.hv-spark{margin-top:var(--s3);border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--canvas)}
.hv-anim{opacity:0;transform:translateY(14px);animation:hvIn .7s cubic-bezier(.22,.85,.3,1) forwards}
@keyframes hvIn{to{opacity:1;transform:none}}
.spark-path{stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.5s .5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){
  .hv-anim{animation:none;opacity:1;transform:none}
  .spark-path{animation:none;stroke-dashoffset:0}
  *{transition:none !important}
}

.trust{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface)}
.loop-step{position:relative;padding-left:var(--s6)}
.loop-num{position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:8px;background:var(--indigo-wash);color:var(--indigo-deep);
  display:grid;place-items:center;font-size:13px;font-weight:600;font-family:var(--mono)}

.price-card{border:1px solid var(--border);border-radius:var(--r-panel);padding:var(--s6);background:var(--surface);position:relative;display:flex;flex-direction:column}
.price-card.feature{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}
.badge-top{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--indigo);color:#fff;
  font-size:12px;font-weight:600;padding:5px 14px;border-radius:999px;white-space:nowrap}
.price-amt{font-size:44px;font-weight:600;letter-spacing:-.03em}
.tick{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:5px 0}
.tick svg{flex:none;margin-top:4px;color:var(--success)}

.faq-item{border-bottom:1px solid var(--border)}
.faq-q{width:100%;background:none;border:0;text-align:left;padding:20px 0;font-size:17px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;gap:var(--s4);align-items:center}
.faq-a{padding:0 0 20px;color:var(--slate);max-width:70ch}

.mkt-footer{background:var(--ink);color:#CBD5E1;padding:var(--s8) 0 var(--s6)}
.mkt-footer h5{color:#fff;font-size:13px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:var(--s3);font-weight:600}
.mkt-footer a{display:block;color:#94A3B8;text-decoration:none;font-size:14.5px;padding:4px 0}
.mkt-footer a:hover{color:#fff}

/* ============================================================
   APPLICATION
   ============================================================ */
.app{min-height:100vh;display:flex;flex-direction:column}
.app-top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border)}
.app-top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.app-nav{display:flex;gap:var(--s1);align-items:center}
.app-nav button{background:none;border:0;padding:9px 13px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--slate);cursor:pointer}
.app-nav button:hover{background:var(--canvas);color:var(--ink)}
.app-nav button[aria-current="page"]{background:var(--indigo-wash);color:var(--indigo-deep)}
@media(max-width:820px){.app-nav{display:none}}
.app-body{flex:1;padding:var(--s6) 0 var(--s9)}

.mobile-tabs{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.mobile-tabs .inner{display:flex}
.mobile-tabs button{flex:1;background:none;border:0;padding:8px 4px;font-size:11px;color:var(--slate);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px}
.mobile-tabs button[aria-current="page"]{color:var(--indigo)}
@media(max-width:820px){.mobile-tabs{display:block}.app-body{padding-bottom:88px}}

.dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:var(--s4);align-items:start}
@media(max-width:940px){.dash-grid{grid-template-columns:1fr}}

.ring{--p:0;width:78px;height:78px;border-radius:50%;flex:none;
  background:conic-gradient(var(--indigo) calc(var(--p)*1%),var(--border) 0);
  display:grid;place-items:center;position:relative}
.ring::after{content:'';position:absolute;inset:8px;background:var(--surface);border-radius:50%}
.ring span{position:relative;z-index:1;font-size:15px;font-weight:600}

.bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:999px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar.teal i{background:var(--teal)}
.bar.warn i{background:var(--warning)}
.bar.danger i{background:var(--danger)}
.bar.success i{background:var(--success)}

.topic-row{display:grid;grid-template-columns:1fr 180px 132px;gap:var(--s4);align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.topic-row:last-child{border-bottom:0}
@media(max-width:700px){.topic-row{grid-template-columns:1fr 120px;gap:var(--s3)}.topic-row .bar-cell{grid-column:1/-1}}

/* ---------- question session ---------- */
.q-top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border)}
.q-top-inner{max-width:1240px;margin:0 auto;padding:var(--s3) var(--s5);display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.q-progress{flex:1;max-width:320px}
.q-layout{max-width:1240px;margin:0 auto;padding:var(--s6) var(--s5) var(--s9);display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:var(--s6);align-items:start}
@media(max-width:1080px){.q-layout{grid-template-columns:1fr;padding-bottom:120px}.q-util{order:2}.desktop-only{display:none}}
.q-main{max-width:760px}
.q-stem{font-size:18px;line-height:1.72}
.q-stem p{margin-bottom:var(--s3)}
.q-lead{font-size:18px;font-weight:600;line-height:1.55;margin:var(--s4) 0 var(--s4)}

.opt{display:flex;gap:var(--s3);width:100%;text-align:left;padding:15px 17px;border:1px solid var(--border);border-radius:13px;
  background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s;align-items:flex-start;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--indigo)}
.opt:disabled{cursor:default}
.opt-mark{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);display:grid;place-items:center;
  font-size:13.5px;font-weight:600;font-family:var(--mono);flex:none;background:var(--canvas)}
.opt[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-wash);box-shadow:inset 0 0 0 1px var(--indigo)}
.opt[aria-pressed="true"] .opt-mark{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.opt.correct{border-color:var(--success);background:var(--success-wash);box-shadow:inset 0 0 0 1px var(--success)}
.opt.correct .opt-mark{background:var(--success);color:#fff;border-color:var(--success)}
.opt.wrong{border-color:var(--danger);background:var(--danger-wash);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.wrong .opt-mark{background:var(--danger);color:#fff;border-color:var(--danger)}
.opt.struck{opacity:.42}
.opt.struck .opt-text{text-decoration:line-through}
.opt-flag{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;margin-top:6px}
.opt-flag.ok{color:var(--success)}
.opt-flag.no{color:var(--danger)}
.opt-text{flex:1}

.conf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
@media(max-width:560px){.conf-grid{grid-template-columns:repeat(2,1fr)}}
.conf-btn{padding:11px 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:13.5px;
  font-weight:500;cursor:pointer;text-align:center;min-height:44px}
.conf-btn:hover{border-color:var(--indigo)}
.conf-btn[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-wash);color:var(--indigo-deep);box-shadow:inset 0 0 0 1px var(--indigo)}

.feedback{border-radius:13px;padding:var(--s4) var(--s5);margin-bottom:var(--s5);border:1px solid}
.feedback.ok{background:var(--success-wash);border-color:#CDEBD6}
.feedback.no{background:var(--danger-wash);border-color:#FBD5D5}
.feedback h3{font-size:20px;display:flex;align-items:center;gap:9px}
.feedback.ok h3{color:var(--success)}
.feedback.no h3{color:var(--danger)}

.exp h4{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo-deep);margin-bottom:var(--s2);font-weight:600}
.exp section{padding:var(--s5) 0;border-bottom:1px solid var(--border)}
.exp section:last-child{border-bottom:0}
.exp p{margin-bottom:var(--s3);line-height:1.72}
.exp p:last-child{margin-bottom:0}
.remember{background:var(--indigo-wash);border-left:4px solid var(--indigo);border-radius:0 12px 12px 0;padding:var(--s4) var(--s5)}
.working{background:var(--canvas);border:1px solid var(--border);border-radius:12px;padding:var(--s4);font-family:var(--mono);font-size:14.5px;line-height:2}
.opt-analysis{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.opt-analysis.is-correct{border-color:#CDEBD6;background:var(--success-wash)}
.ref{display:flex;gap:var(--s3);padding:13px 0;border-bottom:1px solid var(--border)}
.ref:last-child{border-bottom:0}

.disclosure{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.disclosure > button{width:100%;background:var(--canvas);border:0;padding:14px 17px;text-align:left;font-size:15px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:var(--s3);min-height:52px}
.disclosure .dbody{padding:var(--s5);border-top:1px solid var(--border)}
.notes-body h5{font-size:15px;margin:var(--s4) 0 var(--s2)}
.notes-body h5:first-child{margin-top:0}
.notes-body p,.notes-body li{font-size:15px;line-height:1.7;color:var(--ink)}
.notes-body ul{padding-left:var(--s5);margin-bottom:var(--s3)}

.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.navgrid button{aspect-ratio:1;border:1px solid var(--border);border-radius:9px;background:var(--surface);
  font-size:13.5px;font-weight:600;font-family:var(--mono);cursor:pointer;display:grid;place-items:center;position:relative;min-height:40px}
.navgrid button.done{background:var(--indigo-wash);border-color:#DDDEF9;color:var(--indigo-deep)}
.navgrid button.cur{border-color:var(--indigo);box-shadow:inset 0 0 0 2px var(--indigo)}
.navgrid button .dot{position:absolute;top:3px;right:3px;font-size:9px;line-height:1}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--slate)}
.legend i{width:15px;height:15px;border-radius:5px;border:1px solid var(--border);display:inline-grid;place-items:center;flex:none;font-size:9px;font-style:normal}

.q-sticky{display:none}
@media(max-width:1080px){
  .q-sticky{display:block;position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--surface);
    border-top:1px solid var(--border);padding:12px var(--s4) max(12px,env(safe-area-inset-bottom))}
}
.q-desktop-submit{display:block}

.quad .flag{background:var(--danger-wash)}
.quad .flag .qk{color:var(--danger)}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:100;display:grid;place-items:center;padding:var(--s4);overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r-panel);padding:var(--s6);max-width:520px;width:100%;

@media(max-width:560px){.modal{padding:var(--s5)}}

.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:14.5px;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);animation:tIn .25s}

@media(max-width:820px){.toast-host{bottom:88px}}

/* ---------- proto banner ---------- */
.proto{background:var(--ink);color:#fff;font-size:13px;padding:9px var(--s4);display:flex;
  align-items:center;justify-content:center;gap:var(--s4);flex-wrap:wrap;text-align:center}

.empty{text-align:center;padding:var(--s7) var(--s4);border:1px dashed var(--border);border-radius:var(--r-card);background:var(--surface)}
.locked{position:relative;border:1px solid var(--border);border-radius:var(--r-card);padding:var(--s6);text-align:center;background:var(--canvas)}

    <h5>Treatment steps (NICE NG136)</h5>
    <p><b>Step 1</b> — Under 55 and not of Black African or African-Caribbean family origin, or has type 2 diabetes: ACE inhibitor or ARB. Aged 55 and over, or of Black African or African-Caribbean family origin without diabetes: calcium channel blocker.</p>

    <p><b>Step 3</b> — ACEi/ARB + CCB + thiazide-like diuretic.</p>
    <p><b>Step 4 (resistant hypertension)</b> — Confirm adherence and measurement technique first. Then: potassium 4.5 mmol/L or below, add low-dose spironolactone 25 mg; potassium above 4.5 mmol/L, add an alpha-blocker or beta-blocker.</p>
    <h5>Targets</h5>

    <p>Use of three or more short-acting beta-agonist inhalers a year — roughly more than one a month — indicates poorly controlled asthma and a materially increased risk of a fatal attack. The National Review of Asthma Deaths identified high SABA use alongside low inhaled corticosteroid use as a recurring feature in preventable deaths.</p>
    <h5>Before escalating treatment, always check</h5>
    <ul><li>Inhaler technique — the commonest reason for apparent treatment failure</li>
    <li>Adherence, judged by preventer collection intervals rather than self-report</li>

    <p>Warfarin inhibits vitamin K epoxide reductase, impairing synthesis of clotting factors II, VII, IX and X, and proteins C and S. Full effect takes 48–72 hours because circulating factors must first be cleared.</p>
    <h5>Interactions</h5>
    <p><b>INR increased by:</b> metronidazole, azole antifungals, macrolides, ciprofloxacin, amiodarone, trimethoprim, SSRIs, omeprazole, cranberry juice, acute alcohol binge.</p>

    <p>The broad rule is that enzyme inhibitors raise the INR and inducers lower it — but always check, since several interactions are not CYP-mediated.</p>
    <h5>Counselling</h5>

    <p>The rescue dose is <b>one sixth of the total daily dose</b>, given as an immediate-release preparation, as required. This is the most frequently examined calculation in palliative care.</p>
    <p>Example: morphine MR 60 mg twice daily is 120 mg total daily. Breakthrough is 120 ÷ 6 = 20 mg.</p>
    <h5>Conversion factors (BNF)</h5>
    <div class="tbl-scroll"><table class="tbl"><tr><th>From</th><th>To</th><th>Factor</th></tr>

    <p>Levels are taken <b>12 hours after the dose</b>, conventionally a morning sample after the previous evening's dose. Target is generally 0.4–1.0 mmol/L.</p>

    <h5>Toxicity</h5>
    <p>A <b>fine</b> tremor is common at therapeutic levels. A <b>coarse</b> tremor is a warning sign of toxicity, alongside vomiting, diarrhoea, ataxia and drowsiness.</p>

/* ---------------- stats helpers ---------------- */
function firstAttemptStats(){
  const ids=Object.keys(S.firstAttempts);
  const correct=ids.filter(id=>S.firstAttempts[id].correct).length;
  return {n:ids.length,correct,pct:ids.length?Math.round(correct/ids.length*100):0};
}
function practiceStats(){
  const n=S.attempts.length, c=S.attempts.filter(a=>a.correct).length;
  return {n,correct:c,pct:n?Math.round(c/n*100):0};
}
function categoryStats(){
  const out={};
  Object.entries(CATEGORIES).forEach(([k,v])=>{
    const qs=QUESTIONS.filter(q=>q.categoryKey===k);
    const seen=qs.filter(q=>S.firstAttempts[q.id]);
    const right=seen.filter(q=>S.firstAttempts[q.id].correct).length;
    out[k]={name:v.name,total:qs.length,seen:seen.length,
      pct:seen.length?Math.round(right/seen.length*100):null,
      coverage:Math.round(seen.length/qs.length*100)};
  });
  return out;
}
function statusLabel(pct,seen){
  if(!seen) return {t:'Not started',cls:''};
  if(pct===null) return {t:'First pass',cls:''};
  if(pct<50) return {t:'Needs attention',cls:'pill-danger'};
  if(pct<75) return {t:'Developing',cls:'pill-warn'};
  return {t:'Secure',cls:'pill-success'};
}
function recommendation(){
  const cats=categoryStats();
  const scored=Object.entries(cats).filter(([,c])=>c.seen>0).sort((a,b)=>(a[1].pct)-(b[1].pct));
  if(!scored.length){
    return {title:'Mixed starter session',count:QUESTIONS.length,
      reason:'Recommended as a starting point — completing it lets AcePharm work out where you are strongest and weakest.',mins:8};
  }
  const [k,c]=scored[0];
  const unseen=c.total-c.seen;
  return {title:c.name,count:Math.max(1,c.total),key:k,
    reason:`Recommended because this is currently your weakest topic at ${c.pct}% first-attempt accuracy${unseen?` and ${unseen} question${unseen>1?'s are':' is'} still unseen`:''}.`,
    mins:Math.max(3,c.total*2)};
}

function startSession(sampleOnly,catKey){
  let qs;
  if(sampleOnly){ qs=[QUESTIONS[0]]; }
  else if(catKey){ qs=QUESTIONS.filter(q=>q.categoryKey===catKey); if(!qs.length) qs=QUESTIONS.slice(); }
  else {
    const b=S.builder;
    qs=QUESTIONS.filter(q=>b.topics.includes(q.categoryKey) &&
      (b.difficulty==='mixed'||q.difficulty.toLowerCase()===b.difficulty));
    if(!qs.length) qs=QUESTIONS.slice();
  }
  S.session={qs,index:0,selected:null,confidence:null,submitted:false,struck:[],
    label: sampleOnly?'Sample question':(catKey?CATEGORIES[catKey].name+' practice':'Smart Mix practice'),
    mode:S.builder.mode,results:[],start:Date.now(),qStart:Date.now(),sample:!!sampleOnly,
    hideOptions:S.hideOptionsDefault};
  if(!S.signedIn && sampleOnly){ S.signedIn=false; }
  go('session');
}
function currentQ(){ return S.session.qs[S.session.index]; }

        </div>` : `

        </div>`}

      ${!s.submitted && !s.hideOptions ? `
        <div class="card mb4">
          <div class="row-between mb3">

          </div>
          <div class="conf-grid">
            ${CONF.map(c=>`<button class="conf-btn" aria-pressed="${s.confidence===c.k}" onclick="setConf('${c.k}')">${c.label}</button>`).join('')}
          </div>
        </div>
        <div class="q-desktop-submit">
          <button class="btn btn-primary btn-lg btn-block" onclick="submitAnswer()" ${s.selected===null?'disabled':''}>Submit answer</button>
          ${s.selected===null?`<p class="micro mt3">Select an answer to continue. Rating your confidence is optional but powers the confidence analysis.</p>`:''}
        </div>` : ''}

      ${s.submitted ? explanationHTML(q) : ''}

  </div>`:''}`;
}

function optionHTML(q,o,i){
  const s=S.session;
  let cls='opt';
  if(s.submitted){
    if(o.c) cls+=' correct';
    else if(s.selected===i) cls+=' wrong';
  } else if(s.struck.includes(i)) cls+=' struck';
  const pressed=(!s.submitted && s.selected===i);
  return `<button class="${cls}" aria-pressed="${pressed}" ${s.submitted?'disabled':''} onclick="selectOpt(${i})">
    <span class="opt-mark" onclick="event.stopPropagation();strikeOpt(${i})">${o.l}</span>
    <span class="opt-text">
      ${o.t}
      ${s.submitted&&o.c?`<span class="opt-flag ok">${icon('check')} Correct answer</span>`:''}
      ${s.submitted&&!o.c&&s.selected===i?`<span class="opt-flag no">${icon('x')} Your answer</span>`:''}
    </span>
  </button>`;
}
function selectOpt(i){ if(S.session.submitted) return; S.session.selected=i; render(); }
function strikeOpt(i){
  const st=S.session.struck, k=st.indexOf(i);
  if(S.session.submitted) return;
  k>=0?st.splice(k,1):st.push(i);
  if(S.session.selected===i) S.session.selected=null;
  render();
}
function setConf(k){ S.session.confidence=k; render(); }

function submitAnswer(){
  const s=S.session, q=currentQ();
  if(s.selected===null) return;
  const correct=q.options[s.selected].c;
  const time=Math.round((Date.now()-s.qStart)/1000);
  if(!S.firstAttempts[q.id]) S.firstAttempts[q.id]={correct,confidence:s.confidence,time};
  S.attempts.push({id:q.id,correct,confidence:s.confidence,time,opened:true,cat:q.categoryKey});
  s.results.push({id:q.id,correct,confidence:s.confidence,time});
  if(S.plan==='free') S.freeUsed++;
  s.submitted=true;
  render();
  const box=document.getElementById('feedback-live'); if(box) box.focus();
}
function nextQuestion(){
  const s=S.session;
  if(s.index+1<s.qs.length){
    s.index++; s.selected=null; s.confidence=null; s.submitted=false; s.struck=[];
    s.qStart=Date.now(); s.hideOptions=S.hideOptionsDefault;
    render(); window.scrollTo(0,0);
  } else finishSession();
}
function jumpTo(i){
  const s=S.session;
  if(i===s.index) return;
  const done=s.results.find(r=>r.id===s.qs[i].id);
  if(!done && !s.submitted && s.selected!==null){ /* allow */ }
  s.index=i; s.selected=null; s.confidence=null; s.submitted=false; s.struck=[]; s.qStart=Date.now();
  render(); window.scrollTo(0,0);
}
function finishSession(){
  const s=S.session;
  S.lastSummary={
    label:s.label,results:s.results.slice(),
    mins:Math.max(1,Math.round((Date.now()-s.start)/60000)),
    sample:s.sample
  };
  S.session=null;
  if(!S.signedIn){ go('sampleEnd'); return; }
  go('summary');
}
function confirmEnd(){
  showModal(`<h3>Pause session?</h3>
    <p class="muted mt3">Your progress will be saved and you can continue later.</p>
    <div class="row gap3 mt5 wrapf">

}

function toggleD(id){

}

function viewProgress(){
  const fa=firstAttemptStats(), pr=practiceStats(), cats=categoryStats();
  const locked = S.plan==='free';
  const all=Object.values(S.firstAttempts);
  const quad={cc:0,cw:0,uc:0,uw:0};
  Object.values(S.firstAttempts).forEach(a=>{
    const confident=a.confidence==='certain'||a.confidence==='fairly';
    if(confident&&a.correct)quad.cc++; else if(confident&&!a.correct)quad.cw++;
    else if(!confident&&a.correct)quad.uc++; else quad.uw++;
  });
  if(fa.n===0){
    return appShell(`<h1 style="font-size:30px" class="mb5">Progress</h1>

document.addEventListener('keydown',e=>{
  if(S.route!=='session'||!S.session) return;
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if($('#modal-host').innerHTML.trim()) return;
  const s=S.session, q=currentQ();
  if(/^[1-9]$/.test(e.key)){ const i=+e.key-1; if(i<q.options.length&&!s.submitted){ selectOpt(i); } }
  else if(e.key==='Enter'){ if(!s.submitted&&s.selected!==null) submitAnswer(); else if(s.submitted) nextQuestion(); }
  else if(e.key.toLowerCase()==='b'){ toggleBookmark(q.id); }
  else if(e.key==='ArrowRight'&&s.submitted){ nextQuestion(); }
});
render();

function aceGreeting(q){

}
function aceChips(q){
  const base=[
    {k:'simpler',t:'Explain this more simply'},
    {k:'whynot',t:'Why not option ' + (q.options.find(o=>!o.c).l) + '?'},
    {k:'similar',t:'Show me a similar case'},
    {k:'test',t:'Test my understanding'},
    {k:'exam',t:'How would this be examined?'}
  ];
  if(q.working) base.splice(1,0,{k:'steps',t:'Walk me through the maths'});
  return base;
}

function aceAnswer(intent,q,freeText){
  const lib=ACE_LIB[q.id]||{};
  if(intent&&lib[intent]) return lib[intent];
  if(freeText) return aceFreeform(freeText,q,lib);
  return `<p>${lib.simpler||'Let me talk you through this question.'}</p>`;
}
function aceFreeform(t,q,lib){
  const s=t.toLowerCase();
  if(/simpl|basic|eli5|confus|don.?t (get|understand)/.test(s)) return lib.simpler||'';
  if(/why not|option [a-e]|wrong/.test(s)) return lib.whynot||'';
  if(/similar|another|example|case/.test(s)) return lib.similar||'';
  if(/test|quiz|check me/.test(s)) return lib.test||'';
  if(/exam|assessment|come up/.test(s)) return lib.exam||'';
  if(/calc|maths|working|step/.test(s)) return lib.steps||lib.simpler||'';
  if(/dose|dosing/.test(s)) return `<p>Dosing detail for this scenario sits in the topic notes for <b>${SUBTOPIC_NOTES[q.subtopic].name}</b> — I've opened them for you below the explanation.</p><p>If you want the licensed doses themselves, check the current BNF monograph rather than relying on me.</p>`;
  return `<p>Good question. Here's how I'd approach it in the context of <b>${q.topic}</b>:</p>${lib.simpler||''}
    <p class="micro mt3">If that's not what you were after, try one of the prompts below or rephrase it.</p>`;
}

function buildPlan(){
  const cats=categoryStats();

  S.plan=days.map((d,i)=>{

    if(i===4) return {day:d,type:'review',title:'Spaced review',detail:'Revisit everything you answered incorrectly this week, plus cards falling due.',mins:20};

function osceAnswer(i){
  const o=S.osce, turn=OSCE.turns[o.turn];
  let chosen, said;
  if(i===-1){
    const v=($('#osce-free').value||'').trim();
    if(!v) return;
    said=v;
    chosen=turn.opts.find(x=>x.score==='good')||turn.opts[0];
    chosen={...chosen,note:'Free-text response. In production Ace would assess what you actually said against the rubric. '+chosen.note};
  } else { chosen=turn.opts[i]; said=chosen.t; }
  o.log.push({me:true,t:said});
  o.log.push({me:false,t:chosen.reply});
  o.scores.push({score:chosen.score,note:chosen.note,said});
  o.turn++;
  if(o.turn>=OSCE.turns.length) o.done=true;
  render();
  setTimeout(()=>{const s=$('#sim'); if(s) s.scrollTop=s.scrollHeight;},60);
}
function viewOsceResult(){
  const o=S.osce;
  const pts=o.scores.reduce((a,s)=>a+(s.score==='best'?2:s.score==='good'?1:0),0);
  const max=o.scores.length*2;
  const pct=Math.round(pts/max*100);
  const band=pct>=80?['Strong','pill-success']:pct>=50?['Developing','pill-warn']:['Needs work','pill-danger'];
  return appShell(`
    <button class="btn btn-ghost btn-sm mb4" onclick="S.osce=null;render()">← Back</button>
    <div class="glow-panel mb5">
      <div class="row-between wrapf gap4">

        <div style="text-align:right"><div class="num" style="font-size:46px;font-weight:600;letter-spacing:-.03em">${pct}%</div>

      </div>
    </div>

    <div class="ace mb4">
      <div class="ace-head"><div class="row gap3"><span class="ace-orb"></span>
        <div><div style="font-weight:600;font-size:15px">Ace — examiner feedback</div>

      <div class="ace-msg"><span class="ace-orb sm"></span><div class="ace-bubble" style="max-width:100%">
        <p>${pct>=80
          ? 'A genuinely good consultation. You gathered before you advised, which is the habit that separates a competent consultation from a recital of facts.'
          : pct>=50
          ? 'A reasonable consultation with a clear pattern to work on: you know the content, but you tended to explain before you had established what she actually believed.'
          : 'The clinical content was largely there, but the consultation structure was not. Almost every mark lost came from telling rather than asking.'}</p>
        <p>${o.scores.some(s=>s.score==='poor')
          ? 'The specific moments to revisit are marked below. Look at what the patient said immediately before each one — the cue was usually in her words.'
          : 'No significant missteps. To push further, work on the economy of your explanations; five minutes goes quickly.'}</p>
      </div></div>
    </div>

    <div class="card mb4">
      <h3 style="font-size:18px" class="mb4">Exchange by exchange</h3>
      ${o.scores.map((s,i)=>`<div class="rubric-row">
        <span class="pill ${s.score==='best'?'pill-success':s.score==='good'?'pill-warn':'pill-danger'}" style="flex:none">
          ${s.score==='best'?'Best':s.score==='good'?'Acceptable':'Missed'}</span>
        <div><p class="small" style="font-weight:500">${esc(s.said)}</p>
        <p class="small muted mt2">${s.note}</p></div>
      </div>`).join('')}
    </div>

    <div class="card mb4">
      <h3 style="font-size:18px" class="mb4">Rubric</h3>
      ${OSCE.rubric.map((r,i)=>{
        const hit=i<o.scores.length?o.scores[i]&&o.scores[i].score!=='poor':pct>=50;
        return `<div class="rubric-row">
          <span style="color:${hit?'var(--success)':'var(--danger)'};flex:none">${hit?icon('check'):icon('x')}</span>
          <div><p class="small" style="font-weight:500">${r[0]}</p><p class="micro mt1">${r[1]}</p></div></div>`;
      }).join('')}
    </div>

    <div class="row gap3 wrapf">
      <button class="btn btn-primary" onclick="startOsce()">Try again</button>
      <button class="btn btn-secondary" onclick="S.osce=null;render()">Choose another scenario</button>
      <button class="btn btn-ghost" onclick="go('ace')">Back to Ace</button>
    </div>`,'ace');
}

         ['Feeds the editorial queue','Report an Ace response and it routes to the same review process as a question report.'],
         ['Never marks its own homework','Questions Ace drafts are labelled as AI-drafted and reviewed by a pharmacist before publication.']]
        .map(([h,b])=>`<div class="card"><h4 style="font-size:16.5px">${h}</h4><p class="small muted mt3">${b}</p></div>`).join('')}
    </div>

    <div class="panel mt6">
      <h2 style="font-size:26px" class="mb5">What you can ask it</h2>
      <div class="grid g2" style="gap:var(--s4)">
        ${[['"Explain this more simply"','It tries a different angle rather than repeating the explanation louder.'],
           ['"Why not option B?"','A real argument for why the distractor fails, and when it would have been right.'],
           ['"Show me a similar case"','A variation on the same concept, with the one detail changed that flips the answer.'],
           ['"Test me on this"','Three quick recall checks with the answers held back.'],
           ['"How would this be examined?"','The disguises this concept usually appears in.'],
           ['Highlight any text','Select a phrase in a question and ask Ace about that specific thing.']]
          .map(([q,a])=>`<div><div style="font-weight:600;color:var(--indigo-deep)">${q}</div><p class="small muted mt2">${a}</p></div>`).join('')}
      </div>
    </div>

    <div class="tc mt6">
      <button class="btn btn-primary btn-lg" onclick="startSession(true)">Try Ace on a real question</button>
      <p class="micro mt3">No account needed.</p>
    </div>
  </div></div>`;
}

/* 6. Router additions */
const _render = render;
render = function(){
  const extra={
    ace:viewAce, ace_planner:viewAcePlanner, ace_generate:viewAceGenerate,
    ace_flash:viewAceFlash, ace_calc:viewAceCalc, ace_osce:viewAceOsce,
    ace_insights:viewAceInsights, acePage:viewAcePage
  };
  if(extra[S.route]){ $('#root').innerHTML=extra[S.route](); return; }
  _render();
};

/* 7. Reset should clear the AI state too */
const _resetAll = resetAll;
resetAll = function(){ S.ace={open:false,thread:[],busy:false,context:null,selection:''};
  S.flashcards=[]; S.plan=null; S.osce=null; _resetAll(); };

/* 8. New question clears the Ace thread so it stays contextual */
const _nextQuestion = nextQuestion;
nextQuestion = function(){ S.ace.thread=[]; S.ace.open=false; _nextQuestion(); };

/* 9. Nav link to the Ace page */
const _mktNav = mktNav;
mktNav = function(){
  return _mktNav().replace('<a href="#pricing">Pricing</a>','<a onclick="go(\'acePage\')" style="cursor:pointer">Ace</a><a href="#pricing">Pricing</a>');
};

render();

</script>
</body>
</html>
