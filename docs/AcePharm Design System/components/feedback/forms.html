<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms & Feedback — AcePharm</title>
<link rel="stylesheet" href="../../styles.css">
<style>
body { padding: 2rem; background: #f8fafc; }
.demo-section { margin-bottom: 2rem; }
.demo-label { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
.field { margin-bottom: 1rem; }
.label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.input { width: 100%; min-height: 46px; padding: 11px 13px; border: 1px solid var(--color-border); border-radius: var(--radius-input); background: white; font-size: 15px; }
.input:focus { outline: none; border-color: var(--color-indigo); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.13); }
</style>
</head>
<body>
<!-- @dsCard group="Components" viewport="700x280" subtitle="Input fields, form elements, error states" name="Forms & Feedback" -->
<h1>Form Elements</h1>

<div class="demo-section">
  <div class="demo-label">Text Input</div>
  <div class="field">
    <label class="label">Email address</label>
    <input type="email" class="input" placeholder="student@university.ac.uk">
  </div>
</div>

<div class="demo-section">
  <div class="demo-label">Error State</div>
  <div class="field">
    <label class="label">Password</label>
    <input type="password" class="input" style="border-color: var(--color-danger);" value="•••">
    <div style="font-size: 13px; color: var(--color-danger); margin-top: 6px;">Password must be at least 10 characters</div>
  </div>
</div>

<div class="demo-section">
  <div class="demo-label">Checkbox</div>
  <label style="display: flex; gap: 11px; align-items: flex-start; font-size: 14.5px; line-height: 1.5; cursor: pointer;">
    <input type="checkbox" style="width: 19px; height: 19px; margin-top: 2px; accent-color: var(--color-indigo); cursor: pointer;">
    I agree to the AcePharm Terms and acknowledge the Privacy Policy
  </label>
</div>
</body>
</html>
